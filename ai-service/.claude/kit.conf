# Stack adapter: Python with uv. Sourced by .claude/bin/check (POSIX sh) from the ai-service folder.

KIT_TYPECHECK="uv run pyright"
KIT_LINT="uv run ruff check ."
KIT_BUILD=""

# Integration tests need the Redis and Postgres from docker-compose.dev.yml and run locally only.
KIT_TEST="uv run pytest -m \"not integration\" --junitxml=../.work/junit-ai-service.xml"
KIT_TEST_REPORT="../.work/junit-ai-service.xml"

# Test files among the given files; a changed source file runs the whole fast suite.
KIT_TEST_RELATED='files=""; for f in "$@"; do case $f in tests/test_*.py) files="$files $f" ;; esac; done; set -- $files; uv run pytest -m "not integration" "$@"'

KIT_COVERAGE="n/a: coverage needs pytest-cov, which is not an approved dependency"
KIT_COVERAGE_THRESHOLD="70"

KIT_FORMAT="uv run ruff format"

KIT_DUPLICATES="n/a: jscpd config covers TypeScript only"
KIT_DUPLICATES_RELATED="n/a: jscpd config covers TypeScript only"
KIT_SIMILAR="n/a: jscpd config covers TypeScript only"

KIT_MAX_CHANGED_LINES="400"

KIT_SETUP=""

KIT_SOURCE_PATTERNS="*.py"

KIT_TEST_PATTERNS="test_*.py */tests/*"

KIT_DANGEROUS_PATTERNS=""

KIT_MODEL_FAST="haiku"
KIT_MODEL_STANDARD="sonnet"
KIT_MODEL_DEEP="opus"
KIT_ROUTE_EXPLORE="fast"
KIT_ROUTE_IMPLEMENT="standard"
KIT_ROUTE_TESTS="standard"
KIT_ROUTE_REVIEW="deep"
KIT_ROUTE_VERIFY="standard"
KIT_BUDGET_TOKENS=""

KIT_IMPROVE=""
