[project]
name = "ai-service"
version = "0.1.0"
authors = [
    { name = "Viktor Krawutschke", email = "viktor.krawutschke@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the Redis and Postgres from docker-compose.dev.yml"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
reportMissingParameterType = true
venvPath = "."
venv = ".venv"
