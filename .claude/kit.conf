# Stack adapter settings, sourced by .claude/bin/check (POSIX sh).
# Copy an adapter from the kit's adapters/ folder over this file, or fill it in by hand.
# Each value is a command. Files are appended for test-related, format and duplicates-related.
# Leave a value empty if the project has no such check; it then reports "not configured".
# A check the project cannot have says why: KIT_BUILD="n/a: library, no build step".
# In a monorepo, a package can have its own <package>/.claude/kit.conf; it applies to the files below it.

KIT_TYPECHECK="node_modules/.bin/tsc --noEmit -p packages/editor-ext/tsconfig.json && node_modules/.bin/tsc --noEmit -p packages/base-formula/tsconfig.json"
KIT_LINT=""
KIT_TEST=""
# JUnit XML report that KIT_TEST writes, relative to the package; the baseline reads test IDs from it.
KIT_TEST_REPORT=""
KIT_TEST_RELATED=""
# Full test run with coverage.
KIT_COVERAGE=""
# Commands that read KIT_COVERAGE's report: per file "<file> TAB <covered lines> TAB <total lines>",
# and the overall line percentage. $KIT_BIN is the root's .claude/bin, where adapter helpers live.
KIT_COVERAGE_FILES=""
KIT_COVERAGE_PCT=""
# Shell patterns of source files that never carry coverage, for example "*.d.ts".
KIT_COVERAGE_EXCLUDE=""
# Percent of the lines in the changed source files that tests must cover, and how many points
# overall coverage may drop below the baseline.
KIT_COVERAGE_THRESHOLD="70"
KIT_COVERAGE_TOLERANCE="0.5"
KIT_FORMAT="node_modules/.bin/prettier --write --ignore-unknown"
KIT_BUILD="node_modules/.bin/nx run-many -t build"

# Duplicated code (jscpd 5, see the adapters). $KIT_BASE is the base branch. KIT_DUPLICATES fails on clones the
# branch adds against the base; legacy clones never block. KIT_DUPLICATES_RELATED does the same for the uncommitted
# files only (the edit hook). KIT_SIMILAR lists similar functions; it never fails.
# The root package scans packages/; the apps have their own kit.conf.
jscpd="node_modules/.bin/jscpd packages --format typescript,tsx,javascript,jsx --ignore '**/*.test.*,**/*.spec.*,**/e2e/**,**/ee/**' --baseline-from-ref \"\$KIT_BASE\" --reporters ai --no-colors"
KIT_DUPLICATES="$jscpd --ignore-identifiers --fail-on-new-clones 0"
KIT_DUPLICATES_RELATED="$jscpd --ignore-identifiers --changed --fail-on-new-clones 0"
KIT_SIMILAR="$jscpd --similarity --kind ast"

# Shell patterns of source files the edit hooks react to, separated by spaces.
KIT_SOURCE_PATTERNS="*.ts *.tsx *.mts *.cts *.js *.jsx *.mjs *.cjs"

# Shell patterns of test files; the test-writer agent may only edit these.
# Empty means the guard's defaults (*.test.*, *.spec.*, tests/, __tests__/, ...).
KIT_TEST_PATTERNS=""

# Stack-specific destructive commands the guard blocks, one extended regex per line.
KIT_DANGEROUS_PATTERNS='migration:reset
migration:down
migration:redo
migrate\.ts[[:space:]]+(down|down-to|redo)
kysely-migration-cli[^;&|]*[[:space:]](down|down-to|redo)'

# Diffs above this many changed lines (without lockfiles and snapshots) get a warning; above twice as many,
# /verify-feature fails. CI reads the same value.
KIT_MAX_CHANGED_LINES="400"

# /verify-feature (all optional; a missing one is recorded as "not configured" in the evidence pack).
# KIT_SEED resets and seeds a local database and prints "seed: <version>". KIT_E2E runs the e2e suite against it.
# KIT_TEST_MOCKED runs the suite with external dependencies replaced and prints "mocked: <what>".
# KIT_SCREENSHOTS writes <AC-ID>-<step>-<desktop|mobile>$KIT_SCREENSHOT_SUFFIX.png into $KIT_SCREENSHOT_DIR.
# KIT_SETUP prepares a fresh worktree of the base branch (the install) for the base-branch screenshots.
# KIT_APP_URL is where the app runs locally, for scripts that need it.
KIT_SEED=""
KIT_E2E=""
KIT_TEST_MOCKED=""
KIT_SCREENSHOTS=""
# Only the e2e tests a change affects (pull requests; the whole suite runs after merge with `evidence data --all`).
# KIT_E2E_RELATED and KIT_SCREENSHOTS_RELATED get the selected test files appended. KIT_E2E_PATTERNS says which files
# are e2e tests. A test runs when its file changed, or when it names a feature (SHOP in SHOP-AC1) whose criterion IDs
# the diff adds. A change to a file in KIT_E2E_FULL_PATTERNS (shared setup), or to code no e2e test maps to, runs
# everything; a change to only tests and docs runs no e2e. Without KIT_E2E_RELATED the whole suite always runs.
KIT_E2E_RELATED=""
KIT_SCREENSHOTS_RELATED=""
KIT_E2E_PATTERNS=""
KIT_E2E_FULL_PATTERNS=""
KIT_SETUP=""
KIT_APP_URL=""

# Paths nobody may read or change, relative to the root, separated by spaces (licence-restricted, vendored).
# The guard blocks them; the sandbox's denyRead in settings.json is what enforces it (see /onboard).
KIT_PROTECTED_PATHS="apps/server/src/ee apps/client/src/ee packages/ee"

# Model routing for dispatched agents (.claude/bin/route). Tiers map to model aliases; the Agent tool takes
# aliases only: sonnet, opus, haiku, fable. Spec, plan and PR description run on the session model.
KIT_MODEL_FAST="haiku"
KIT_MODEL_STANDARD="sonnet"
KIT_MODEL_DEEP="opus"
KIT_ROUTE_EXPLORE="fast"
KIT_ROUTE_IMPLEMENT="standard"
KIT_ROUTE_TESTS="standard"
KIT_ROUTE_REVIEW="deep"
KIT_ROUTE_VERIFY="standard"
# Tokens (input, output and cache writes) a branch may use; empty means no budget. The usage hook warns
# at 80 percent and blocks the next dispatch at 100 percent.
KIT_BUDGET_TOKENS=""

# Run records in reports/runs/ and the /improve-kit loop (.claude/bin/runs). Empty: off; "1": on.
KIT_IMPROVE=""

# Which approval gates ask the user first (.claude/bin/gate). The environment wins: KIT_APPROVAL=autonomous claude.
# strict: every gate asks. standard: spec and plan ask, the rest decide and log under Decisions to review in
# .work/<branch>.md. autonomous: no gate asks. Secrets, protected paths, force push, deletes and merging always ask or block.
KIT_APPROVAL="autonomous"
# One gate on its own: KIT_GATE_<SPEC|PLAN|DEPS|SPLIT|CONFIG|COMMIT|PUSH>="ask" or "auto", for example
# KIT_GATE_PUSH="ask"
