<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 660" width="1020" height="660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Architecture of the AI knowledge assistant</title>
<desc id="desc">A question travels from the browser through ai-bridge in the Docmost server, which signs a short-lived user token, to ai-service, which searches the vector index in readable spaces only. ai-bridge filters every candidate page against live permissions, the local model answers from allowed sections only, and ai-bridge checks every cited page again before the answer returns.</desc>
<style>
  .bg { fill: #ffffff; stroke: #d0d7de; }
  .box { fill: #ffffff; stroke: #d0d7de; }
  .chip { fill: #f6f8fa; stroke: #d0d7de; }
  .t { fill: #1f2328; }
  .m { fill: #59636e; }
  .line { stroke: #8c959f; fill: none; }
  .acc { fill: #1c7ed6; }
  .ok { fill: #2f9e44; }
  .bad { fill: #e03131; }
  .hl { fill: #1c7ed6; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; stroke: #3d444d; }
    .box { fill: #0d1117; stroke: #3d444d; }
    .chip { fill: #151b23; stroke: #3d444d; }
    .t { fill: #e6edf3; }
    .m { fill: #9198a1; }
    .line { stroke: #656c76; }
    .acc { fill: #4dabf7; }
    .ok { fill: #51cf66; }
    .bad { fill: #ff6b6b; }
    .hl { fill: #4dabf7; }
  }
</style>
