<g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5125;0.6500"/><text class="bad" x="300" y="206" font-size="12" font-weight="700" text-anchor="middle">✕ restricted page dropped</text></g>
<circle class="ok" r="6" opacity="0"><animateMotion dur="16.0s" repeatCount="indefinite" path="M450,246 L630,246" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5563;0.6375;1"/><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.5563;0.6375"/></circle>
<circle class="acc" r="6" opacity="0"><animateMotion dur="16.0s" repeatCount="indefinite" path="M830,226 L890,226" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.6625;0.7125;1"/><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6625;0.7125"/></circle>
<circle class="acc" r="6" opacity="0"><animateMotion dur="16.0s" repeatCount="indefinite" path="M890,246 L830,246" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7312;0.7812;1"/><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.7312;0.7812"/></circle>
<circle class="acc" r="6" opacity="0"><animateMotion dur="16.0s" repeatCount="indefinite" path="M655,260 L655,292 L515,292 L515,338 L450,338" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.8063;0.8688;1"/><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.8063;0.8688"/></circle>
<circle class="acc" r="6" opacity="0"><animateMotion dur="16.0s" repeatCount="indefinite" path="M250,338 L95,338 L95,190" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.8812;0.9625;1"/><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.8812;0.9625"/></circle>
<circle class="acc" r="4" opacity="0.6"><animateMotion dur="3s" repeatCount="indefinite" path="M890,545 L830,545"/></circle>
<line class="line" x1="24" y1="600" x2="996" y2="600" stroke-width="1"/>
<g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0000;0.1437"/><circle class="acc" cx="38" cy="630" r="13"/><text x="38" y="635" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text class="t" x="62" y="635" font-size="15">The panel sends the question with the user's normal Docmost session.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.1437;0.2687"/><circle class="acc" cx="38" cy="630" r="13"/><text x="38" y="635" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text class="t" x="62" y="635" font-size="15">ai-bridge signs a 60-second user token that lists the spaces this user may read.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2687;0.3937"/><circle class="acc" cx="38" cy="630" r="13"/><text x="38" y="635" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text class="t" x="62" y="635" font-size="15">ai-service searches the vector index, limited to those spaces.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3937;0.6500"/><circle class="acc" cx="38" cy="630" r="13"/><text x="38" y="635" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text class="t" x="62" y="635" font-size="15">ai-bridge re-checks every candidate page against live permissions. Restricted pages never reach the prompt.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.6500;0.8000"/><circle class="acc" cx="38" cy="630" r="13"/><text x="38" y="635" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text class="t" x="62" y="635" font-size="15">The local model writes the answer from the allowed sections only.</text></g>
<g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.8000;1.0000"/><circle class="acc" cx="38" cy="630" r="13"/><text x="38" y="635" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text class="t" x="62" y="635" font-size="15">ai-bridge checks every cited page again, then the answer streams back with its sources.</text></g>
</svg>
