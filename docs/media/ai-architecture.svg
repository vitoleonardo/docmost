<circle class="acc" r="6" opacity="0"><animateMotion dur="16.0s" repeatCount="indefinite" path="M830,160 L862,160 L862,520 L830,520" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2812;0.3750;1"/><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.2812;0.3750"/></circle>
<circle class="ok" r="6" opacity="0"><animateMotion dur="16.0s" repeatCount="indefinite" path="M630,172 L540,172 L540,226 L450,226" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4062;0.4938;1"/><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.4062;0.4938"/></circle>
