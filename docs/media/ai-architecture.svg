<rect class="box" x="20" y="80" width="150" height="110" rx="10" stroke-width="1.5"/>
<text class="t" x="34" y="106" font-size="15" font-weight="700">Browser</text>
<text class="m" x="34" y="125" font-size="12">Assistent panel</text>
<text class="m" x="34" y="146" font-size="12">React · Mantine</text>
<text class="m" x="34" y="163" font-size="12">normal session</text>
<rect class="box" x="240" y="70" width="220" height="340" rx="10" stroke-width="1.5"/>
<text class="t" x="254" y="96" font-size="15" font-weight="700">Docmost server</text>
<text class="m" x="254" y="115" font-size="12">ai-bridge · NestJS</text>
<rect class="box" x="620" y="70" width="220" height="340" rx="10" stroke-width="1.5"/>
<text class="t" x="634" y="96" font-size="15" font-weight="700">ai-service</text>
<text class="m" x="634" y="115" font-size="12">Python · FastAPI</text>
<rect class="box" x="890" y="170" width="110" height="120" rx="10" stroke-width="1.5"/>
<text class="t" x="904" y="196" font-size="15" font-weight="700">Ollama</text>
<text class="m" x="904" y="215" font-size="12">qwen3:8b</text>
<text class="m" x="904" y="236" font-size="12">local model</text>
<text class="m" x="904" y="253" font-size="12">on the Mac</text>
<rect class="box" x="240" y="460" width="600" height="120" rx="10" stroke-width="1.5"/>
<text class="t" x="254" y="486" font-size="15" font-weight="700">Postgres 18 + pgvector</text>
<rect class="box" x="890" y="460" width="110" height="120" rx="10" stroke-width="1.5"/>
<text class="t" x="904" y="486" font-size="15" font-weight="700">Index worker</text>
<text class="m" x="904" y="505" font-size="12">page events</text>
<text class="m" x="904" y="526" font-size="12">via Redis,</text>
<text class="m" x="904" y="543" font-size="12">embeddings</text>
<text class="m" x="904" y="560" font-size="12">on the CPU</text>
<rect class="hl" x="890" y="170" width="110" height="120" rx="10" opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;0.16;0" keyTimes="0;0.6500;0.8000"/></rect>
<rect class="chip" x="250" y="128" width="200" height="44" rx="8"/>
<rect class="hl" x="250" y="128" width="200" height="44" rx="8" opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;0.16;0" keyTimes="0;0.1437;0.2687"/></rect>
<text class="t" x="260" y="146" font-size="13" font-weight="600">Session → user token</text>
<text class="m" x="260" y="163" font-size="11">signed, 60 s, readable spaces</text>
<rect class="chip" x="250" y="214" width="200" height="44" rx="8"/>
<rect class="hl" x="250" y="214" width="200" height="44" rx="8" opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;0.16;0" keyTimes="0;0.3937;0.6500"/></rect>
<text class="t" x="260" y="232" font-size="13" font-weight="600">Permission filter</text>
<text class="m" x="260" y="249" font-size="11">live: space, membership, trash</text>
<rect class="chip" x="250" y="316" width="200" height="44" rx="8"/>
<rect class="hl" x="250" y="316" width="200" height="44" rx="8" opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;0.16;0" keyTimes="0;0.8000;1.0000"/></rect>
<text class="t" x="260" y="334" font-size="13" font-weight="600">Citation check</text>
<text class="m" x="260" y="351" font-size="11">every cited page, again</text>
<rect class="chip" x="630" y="128" width="200" height="44" rx="8"/>
<rect class="hl" x="630" y="128" width="200" height="44" rx="8" opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;0.16;0" keyTimes="0;0.2687;0.3937"/></rect>
<text class="t" x="640" y="146" font-size="13" font-weight="600">Retrieval</text>
<text class="m" x="640" y="163" font-size="11">vector search, readable spaces</text>
<rect class="chip" x="630" y="214" width="200" height="44" rx="8"/>
<rect class="hl" x="630" y="214" width="200" height="44" rx="8" opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;0.16;0" keyTimes="0;0.6500;0.8000"/></rect>
<text class="t" x="640" y="232" font-size="13" font-weight="600">Inference adapter</text>
<text class="m" x="640" y="249" font-size="11">one OpenAI-compatible API</text>
<rect class="chip" x="630" y="316" width="200" height="44" rx="8"/>
<text class="t" x="640" y="334" font-size="13" font-weight="600">Agent · Extraction</text>
<text class="m" x="640" y="351" font-size="11">tools call back as the user</text>
<rect class="chip" x="252" y="494" width="270" height="70" rx="8"/>
<text class="t" x="264" y="516" font-size="13" font-weight="600">schema public</text>
<text class="m" x="264" y="534" font-size="11">wiki pages, spaces, permissions</text>
<text class="m" x="264" y="551" font-size="11">read only through Docmost services</text>
<rect class="chip" x="548" y="494" width="282" height="70" rx="8"/>
<rect class="hl" x="548" y="494" width="282" height="70" rx="8" opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;0.16;0" keyTimes="0;0.2687;0.3937"/></rect>
<text class="t" x="560" y="516" font-size="13" font-weight="600">schema ai</text>
<text class="m" x="560" y="534" font-size="11">sections + embeddings, agent runs</text>
<text class="m" x="560" y="551" font-size="11">ai-service role: this schema only</text>
<text class="m" x="210" y="146" font-size="11" text-anchor="middle">question</text>
<text class="m" x="540" y="141" font-size="11" text-anchor="middle">signed user token</text>
<text class="m" x="495" y="218" font-size="11" text-anchor="middle">candidates</text>
<text class="m" x="540" y="264" font-size="11" text-anchor="middle">allowed only</text>
<text class="m" x="585" y="284" font-size="11" text-anchor="middle">answer + sources</text>
<text class="m" x="172" y="356" font-size="11" text-anchor="middle">cited answer</text>
<text class="m" x="874" y="430" font-size="11" transform="rotate(-90 874 430)" text-anchor="middle">search</text>
<circle class="acc" r="6" opacity="0"><animateMotion dur="16.0s" repeatCount="indefinite" path="M170,155 L250,155" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.0187;0.1125;1"/><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.0187;0.1125"/></circle>
